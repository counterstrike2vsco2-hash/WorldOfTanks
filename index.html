<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoT 0.9.0 — Браузерная версия</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

<!-- ========== АНГАР ========== -->
<div id="hangar">
  <div id="topbar">
    <span class="logo">WoT <b>0.9.0</b> <i>browser</i></span>
    <span class="tabs">АНГАР&nbsp;&nbsp;СКЛАД&nbsp;&nbsp;МАГАЗИН&nbsp;&nbsp;ДОСТИЖЕНИЯ&nbsp;&nbsp;ИССЛЕДОВАНИЯ&nbsp;&nbsp;КАЗАРМА</span>
    <span class="server">Сервер: <b>offline.loc</b></span>
  </div>

  <button id="battleBtn">В БОЙ!</button>

  <div id="garage">
    <canvas id="preview" width="640" height="300"></canvas>
    <div id="tankName">МС-1 <span class="cls">Лёгкий танк</span></div>
    <div id="stats">
      <div class="stat"><span>Урон</span><div class="bar"><div id="stDmg" class="fill"></div></div></div>
      <div class="stat"><span>Прочность</span><div class="bar"><div id="stHp" class="fill"></div></div></div>
      <div class="stat"><span>Скорость</span><div class="bar"><div id="stSpd" class="fill"></div></div></div>
      <div class="stat"><span>Скорострельность</span><div class="bar"><div id="stRel" class="fill"></div></div></div>
    </div>
  </div>

  <div id="carousel"></div>

  <div id="hint">WASD — движение корпуса &nbsp;•&nbsp; Мышь — башня &nbsp;•&nbsp; ЛКМ — огонь &nbsp;•&nbsp; ПКМ — снайперский прицел</div>
</div>

<!-- ========== БОЙ ========== -->
<div id="battle" class="hidden">
  <canvas id="game"></canvas>

  <div id="scorebar">
    <span id="scoreAlly" class="green">5</span>
    <span id="timer">05:00</span>
    <span id="scoreEnemy" class="red">5</span>
  </div>

  <div id="feed"></div>

  <canvas id="minimap" width="170" height="116"></canvas>

  <div id="hud">
    <div id="hudName">МС-1</div>
    <div id="hpbar"><div id="hpfill"></div><span id="hptext">130/130</span></div>
    <canvas id="reloadC" width="58" height="58"></canvas>
  </div>

  <div id="battleMsg"></div>

  <div id="endScreen" class="hidden">
    <div id="endTitle">ПОБЕДА!</div>
    <div id="endStats"></div>
    <button id="toHangar">В АНГАР</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
